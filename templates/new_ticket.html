<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <title>New Ticket</title>
    </head>

    <body>
        <!-- navigation bar: lets you get around without typing URLs -->
        <nav class="navbar">
            <a href="/">Home</a>
            <a href="/tickets">All Tickets</a>
            <a href="/new">New Ticket</a>
        </nav>
        <h1>New Ticket</h1>

        <!-- action="/new" means: send this form's data back to the /new route -->
        <!-- method="POST" means: this is a "submit data" request, not just "view a page" -->
        <form class="ticket-form" action="/new" method="POST">

            <label>Requester:</label>
            <!-- name="requester" is the key Flask will use to read this field's value -->
            <input type="text" name="requester">
            <br>

            <label>Description:</label>
            <input type="text" name="description">
            <br>

            <label>Assigned to:</label>
            <input type="text" name="assigned_to">
            <br>

            <label>Priority:</label>
            <select name="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <br>

            <label>Asset ID:</label>
            <input type="text" name="asset_id">
            <br>

            <label>Resolution Notes:</label>
            <input type="text" name="resolution_notes">
            <br>

            <label>
            <!-- checkboxes need a "value" too — this is what gets sent IF checked -->
            <input type="checkbox" name="already_resolved" value="yes">
            Already resolved?
            </label>
            <br>

            <input type="submit" value="Create Ticket">
        </form>
    </body>
</html>
