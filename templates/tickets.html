<!DOCTYPE html>
<html>
    <head>
        <title>Tickets</title>
    </head>

    <body>
        <table>
            <tr>
                <th>ID</th>
                <th>Assigned To</th>
                <th>Requester</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Asset ID</th>
                <th>Created at</th>
                <th>Resolved at</th>
            </tr>
            {% for ticket in tickets %}
            <tr>
                <td>{{ ticket[0] }}</td>
                <td>{{ ticket[1] }}</td>
                <td>{{ ticket[2] }}</td>
                <td>{{ ticket[3] }}</td>
                <td>{{ ticket[4] }}</td>
                <td>{{ ticket[5] }}</td>
                <td>{{ ticket[6] }}</td>
                <td>{{ ticket[7] }}</td>
                <td>{{ ticket[8] }}</td>
            </tr>
            {% endfor %}
        </table>
    </body>

</html>
